[project]
name = "new-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.4",
    "yfinance>=1.6.0",
]

[project.scripts]
new-project = "new_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.pyright]
extraPaths = ["."]


